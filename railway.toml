[build]
builder = "RAILPACK"
# Railway sudah tidak menjalankan Nixpacks: build dengan builder itu gagal
# dalam satu detik tanpa log sama sekali.
# Versi Node ditentukan lewat engines.node di package.json dan .nvmrc.
# Next.js 16 butuh >=20.9 dan Prisma 7 butuh >=22.12; tanpa itu builder
# menebak Node lama dan `npm ci` gagal.
buildCommand = "npm run build"

[deploy]
startCommand = "npm run start"
healthcheckPath = "/login"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
